name: pr-checks

# Gates de PR para dev/main: lint de shell/workflows + contrato de migration.
# Canônico G1: validação roda no GitHub, não local.
on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev

permissions:
  contents: read

jobs:
  lint-shell:
    uses: ./.github/workflows/_lint-shell.yml

  enforce-migration-dir:
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/_enforce-migration-dir.yml

  # spec 009 R2: scripts de ENTRYPOINT/CMD em Dockerfiles devem ser 100755 (evita
  # "exec: ./entrypoint.sh: permission denied" no deploy).
  guard-entrypoint-exec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ENTRYPOINT scripts executaveis (100755)
        run: bash scripts/ci/check_entrypoint_exec_bit.sh

  # E016/E017: pacote @artificio/* novo virava dependency de um app sem entrar no
  # `COPY` do stage production do Dockerfile. Build e CI passavam verdes e o container
  # crashava com MODULE_NOT_FOUND direto em beta/prod. Aconteceu DUAS vezes — a
  # prevencao documentada em E016 dependia de alguem lembrar de auditar, e nao foi
  # seguida quando `@artificio/catalog-matching` entrou (E017). Agora e mecanico.
  guard-dockerfile-workspace-deps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Imports @artificio/* x COPY do stage production
        run: node scripts/ci/check_dockerfile_workspace_deps.mjs
