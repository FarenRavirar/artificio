name: scorecard

# Spec 026 F-SEC: OpenSSF Scorecard avalia a postura de supply-chain do repo.
# publish_results=false (NAO envia dados a API externa da OpenSSF nesta etapa).
# SARIF vai para Security -> Code scanning. Gratis em repo publico, sem cadastro.
on:
  push:
    branches:
      - dev
  schedule:
    - cron: "13 5 * * 1" # semanal, segunda 05:13 UTC
  branch_protection_rule:

permissions:
  contents: read

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run analysis
        # F2: terceiro pinado por SHA (v2.4.3). Bump via Dependabot.
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: false

      - name: Upload SARIF to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4.39.4
        with:
          sarif_file: results.sarif
