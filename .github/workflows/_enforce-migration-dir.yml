name: _enforce-migration-dir

# Reusável: bloqueia PR que adiciona/altera .sql fora de diretórios de migration allowlisted,
# e varre TODO .sql rastreado no repo para fechar o ponto cego de passivo pré-existente (R15).
# Mantém migrations rastreáveis e dentro do contrato de módulo (D039 / contrato de módulo G1).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  enforce:
    name: Enforce migration dir
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate SQL paths (allowlist + full scan)
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail

          allowlist_file=".github/migration-dir-allowlist"
          if [ ! -f "$allowlist_file" ]; then
            echo "ERRO: $allowlist_file ausente"
            exit 1
          fi

          # Padroes permitidos (ignora comentarios/linhas vazias), glob bash nativo.
          mapfile -t patterns < <(grep -vE '^[[:space:]]*(#|$)' "$allowlist_file")
          if [ "${#patterns[@]}" -eq 0 ]; then
            echo "ERRO: allowlist vazia"
            exit 1
          fi

          is_allowed_sql_path() {
            local path="$1"
            local pattern=""
            for pattern in "${patterns[@]}"; do
              # shellcheck disable=SC2053  # pattern contem glob intencional.
              if [[ "$path" == ${pattern}* ]]; then
                return 0
              fi
            done
            return 1
          }

          if ! is_allowed_sql_path "apps/mesas/database/migration_999_selftest.sql"; then
            echo "::error::self-test allowlist falhou para path permitido"
            exit 1
          fi
          if is_allowed_sql_path "database/migration_999_selftest.sql"; then
            echo "::error::self-test allowlist permitiu path proibido"
            exit 1
          fi
          if ! is_allowed_sql_path "specs/999-selftest/phase-5-measurement.sql"; then
            echo "::error::self-test allowlist falhou para evidência de medição permitida"
            exit 1
          fi
          if is_allowed_sql_path "specs/999-selftest/consulta-arbitraria.sql"; then
            echo "::error::self-test allowlist permitiu SQL arbitrário em specs"
            exit 1
          fi
          # Regressão do ponto cego (spec 093, R15): o diretório órfão
          # apps/mesas/backend/migrations/ estava fora da allowlist e nunca
          # disparava bloqueio porque o check antigo só via --diff-filter=AM.
          if is_allowed_sql_path "apps/mesas/backend/migrations/006_create_vtt_platforms.sql"; then
            echo "::error::self-test allowlist permitiu orfao fora da allowlist (regressao R15)"
            exit 1
          fi
          echo "Self-test allowlist: permitido/bloqueado OK."

          fail=0

          # Varredura COMPLETA: todo .sql rastreado no repo precisa estar na
          # allowlist. Fecha o ponto cego do --diff-filter=AM (arquivo
          # pré-existente fora da allowlist nunca disparava bloqueio).
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            if is_allowed_sql_path "$f"; then
              continue
            fi
            echo "::error file=$f::SQL fora dos caminhos allowlisted em .github/migration-dir-allowlist"
            fail=1
          done < <(git ls-files '*.sql')

          # Proteção de fluxo: arquivos .sql adicionados (A) ou modificados (M)
          # no diff do PR também precisam estar na allowlist.
          git fetch origin "$BASE_REF" --depth=1
          base_sha=$(git rev-parse "origin/${BASE_REF}")
          mapfile -t changed_sql < <(git diff --name-only --diff-filter=AM "${base_sha}...HEAD" -- '*.sql')
          for f in "${changed_sql[@]}"; do
            [ -z "$f" ] && continue
            if ! is_allowed_sql_path "$f"; then
              echo "::error file=$f::SQL fora dos caminhos allowlisted em .github/migration-dir-allowlist"
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            echo "BLOCKED: mova o SQL para um caminho allowlisted em .github/migration-dir-allowlist."
            exit 1
          fi
          echo "Todos os .sql rastreados dentro do contrato. OK."
