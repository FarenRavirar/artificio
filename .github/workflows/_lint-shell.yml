name: _lint-shell

# Reusável: lint de shell scripts (shellcheck) + workflows (actionlint).
# Canônico G1: tudo que valida deploy/código roda no GitHub Actions, não local.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: ShellCheck
        # F2 (spec 026): pin por SHA (supply-chain). Bump = trocar SHA + comentario.
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: ./scripts

      - name: Migration lock self-test
        run: bash scripts/deploy/test_migration_lock.sh

      - name: Migration guard self-test
        run: bash scripts/deploy/test_migration_guard.sh

      - name: Migration reconcile self-test
        run: bash scripts/deploy/test_migration_reconcile.sh

      - name: Branch invariant self-test
        run: bash scripts/deploy/test_branch_invariant.sh

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # actionlint upstream, direto — sem o wrapper `reviewdog/action-actionlint`.
      #
      # O wrapper usava `reporter: github-check`, que cria um *check run* pela API.
      # Essa API **só aceita GitHub App** (medido: `POST /check-runs` com token de
      # Actions devolve `403 "You must authenticate via a GitHub App"`), e o App do
      # reviewdog nunca foi instalado neste repo — os únicos que criam check run
      # aqui são `github-actions`, `github-advanced-security` e `semgrep-code`.
      # Sem o App, o reviewdog roteia pelo servidor dele (doghouse), que traduz
      # para a API. Em 2026-08-17 esse servidor devolveu `503` em três tentativas
      # seguidas e derrubou o gate — com zero achados de lint no log.
      #
      # Conceder `checks: write` NÃO resolveria: a barreira é ser App, não a
      # permissão. O defeito de fundo é o gate depender de um terceiro fora do
      # nosso controle, que ninguém monitora.
      #
      # Agravante que o wrapper escondia: o `reviewdog` sai com código 1 tanto
      # para "achei erro de lint" quanto para "falhei ao publicar". O job ficava
      # vermelho sem distinguir defeito nosso de indisponibilidade alheia — foi
      # exatamente o que aconteceu.
      #
      # Rodando o binário direto, o exit code é do `actionlint` e de mais ninguém,
      # e as anotações inline continuam, via problem matcher oficial.
      #
      # F2 (spec 026): pin por versão + checksum. Bump = trocar versão, checksum e
      # a tag do matcher, juntos.
      - name: Instalar actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --silent --show-error --location \
            -o "${tarball}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          echo "${ACTIONLINT_SHA256}  ${tarball}" | sha256sum --check --strict
          tar -xzf "${tarball}" actionlint
          rm -f "${tarball}"

      - name: actionlint
        run: |
          set -euo pipefail
          echo "::add-matcher::.github/actionlint-matcher.json"
          ./actionlint -color
