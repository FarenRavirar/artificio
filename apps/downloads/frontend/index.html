<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Favicon no HTML, não só no applyFavicon() do main.tsx: medido em produção
         (2026-09-24), com o ícone só injetado por JS o navegador pedia /favicon.ico e
         recebia 404. O Vite não resolve nome de pacote no index.html, só caminho
         relativo; este passa pelo symlink do workspace e sai com o mesmo hash do
         import de @artificio/ui. -->
    <link rel="icon" type="image/png" href="./node_modules/@artificio/ui/src/faviconV2.png" />

    <title>Artifício Downloads — Materiais gratuitos de RPG em português</title>
    <meta name="description" content="Catálogo gratuito de materiais de RPG em português: aventuras, fichas, mapas e mais, por sistema e edição." />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="Artifício Downloads — Materiais gratuitos de RPG em português" />
    <meta property="og:description" content="Catálogo gratuito de materiais de RPG em português." />
    <meta property="og:image" content="https://downloads.artificiorpg.com/og-default.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:site_name" content="Artifício Downloads" />
    <meta property="og:locale" content="pt_BR" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Artifício Downloads" />
    <meta name="twitter:description" content="Catálogo gratuito de materiais de RPG." />
    <meta name="twitter:image" content="https://downloads.artificiorpg.com/og-default.png" />

    <!-- Tema lua/sol sem flash (D067). Cookie compartilhado `artificio_theme`. -->
    <script>
      (function () {
        try {
          var m = document.cookie.match(/(?:^|;\s*)artificio_theme=(dark|light)/);
          document.documentElement.dataset.theme = m ? m[1] : 'dark';
        } catch { document.documentElement.dataset.theme = 'dark'; }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
