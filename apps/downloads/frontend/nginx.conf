# nginx.conf — Frontend Downloads RPG
# Serve o build estatico do React e faz proxy das chamadas /api para o backend

set_real_ip_from ${TRUSTED_REAL_IP_FROM};
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de hardening (X-Frame-Options, X-Content-Type-Options, Referrer-Policy,
    # Permissions-Policy) sairam daqui em 2026-08-03 e passaram a ser emitidos na borda
    # Cloudflare, pela Transform Rule `sec-headers-baseline` da zona (decisoes D5/D6,
    # sessao 26-08-03_1_seguranca_snyk-headers-sast).
    #
    # Motivo: aqui eles cobriam so o HTML. `add_header` dentro de uma `location` descarta
    # todos os `add_header` herdados do bloco pai, entao a location de assets abaixo
    # (que define Cache-Control proprio) servia todo /assets/*.js sem nenhum dos quatro.
    # Medido em producao antes da correcao: HTML 4/4, asset 0/4.
    #
    # Nao readicionar aqui: dois donos para o mesmo header foi o que a decisao D1 evitou
    # no HSTS. Se a regra da borda for removida, a cobertura destes headers cai em TODOS
    # os apps da zona, nao so neste.

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 1024;

    location /api/ {
        # O upload de admin recebe o corpo cru em `express.raw({ limit: '20mb' })`
        # (`apps/downloads/backend/src/routes/admin.ts`). Sem esta linha o nginx
        # aplica o default de 1MB e corta com 413 antes do backend. Mesmo defeito
        # medido em mesas (2026-08-27); aqui era latente, nao reportado.
        client_max_body_size 20m;
        proxy_pass http://${API_UPSTREAM}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /robots.txt {
        proxy_pass http://${API_UPSTREAM}:3000/robots.txt;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /sitemap.xml {
        proxy_pass http://${API_UPSTREAM}:3000/sitemap.xml;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Spec 089 Fase 8: humano e crawler recebem o mesmo shell HTML dinâmico.
    # O backend resolve OG/canonical/status; nenhuma seleção por User-Agent.
    location ~ ^/materiais/[^/]+/?$ {
        proxy_pass http://${API_UPSTREAM}:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
