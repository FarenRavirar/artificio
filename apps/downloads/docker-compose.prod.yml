services:
  downloads-app:
    build:
      context: ../..
      dockerfile: apps/downloads/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-https://downloads.artificiorpg.com}
        VITE_PUBLIC_SITE_URL: ${VITE_PUBLIC_SITE_URL:-https://downloads.artificiorpg.com}
        VITE_ACCOUNTS_URL: ${VITE_ACCOUNTS_URL:-https://accounts.artificiorpg.com}
        VITE_GA_ID: ${VITE_GA_ID:-G-2H50PCM950}
        VITE_SITE_ADMIN_SYSTEMS_URL: ${VITE_SITE_ADMIN_SYSTEMS_URL:-https://artificiorpg.com/admin/sistemas}
    container_name: downloads-app
    restart: always
    expose:
      - "80"
    networks:
      - artificio_net
    environment:
      - API_UPSTREAM=downloads-api
      - TRUSTED_REAL_IP_FROM=${TRUSTED_REAL_IP_FROM:-172.18.0.0/16}
    command:
      - /bin/sh
      - -c
      - rm -rf /frontend-dist/* && cp -r /usr/share/nginx/html/. /frontend-dist/ && exec /docker-entrypoint.sh nginx -g 'daemon off;'
    volumes:
      - frontend_dist_downloads_prod:/frontend-dist
    depends_on:
      downloads-api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3

  downloads-api:
    build:
      context: ../..
      dockerfile: apps/downloads/backend/Dockerfile
    container_name: downloads-api
    restart: always
    expose:
      - "3000"
    networks:
      - artificio_net
    environment:
      - NODE_ENV=production
      - APP_ENV=production
      - PORT=3000
      - PUBLIC_SITE_URL=https://downloads.artificiorpg.com
      - INDEX_HTML_PATH=/app/frontend-dist/index.html
      - DATABASE_URL=${DATABASE_URL:?DATABASE_URL is required}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - FRONTEND_URL=https://downloads.artificiorpg.com
      # Spec 087 (achados de review PR #214, Codex P2):
      # TRUSTED_PROXY_CIDR — sem isto no container, `trust proxy` do Express cai
      # no default e `req.ip` vira o IP do nginx se a rede docker mudar de CIDR,
      # colapsando a dedup de visualizacao num hash so. Mesma variavel que
      # mesas/site/links/glossario/accounts ja injetam.
      # VIEW_HASH_SECRET — segredo do HMAC que anonimiza a origem da view.
      # Obrigatorio (`:?`): sem ele o hash voltaria a ser reversivel por
      # forca bruta offline, entao falhar no boot e melhor que degradar calado.
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.18.0.0/16}
      - VIEW_HASH_SECRET=${VIEW_HASH_SECRET:?VIEW_HASH_SECRET is required}
      - ACCOUNTS_URL=${ACCOUNTS_URL:-https://accounts.artificiorpg.com}
      # Spec 083: resolucao server-to-server de e-mail do autor (accounts.)
      # e envio transacional (Resend) de reprovacao/aprovacao de material.
      # T2.2a (spec 090): credencial registrada `<token_id>.<segredo>`, que
      # identifica source_app e realm no accounts. Obrigatoria (`:?`) desde
      # 2026-08-07 (T2.2a-op, passo 6), quando SERVICE_SECRET saiu.
      - SERVICE_CREDENTIAL=${SERVICE_CREDENTIAL:?SERVICE_CREDENTIAL is required}
      - RESEND_API_KEY=${RESEND_API_KEY:?RESEND_API_KEY is required}
      - EMAIL_FROM_ADDRESS=${EMAIL_FROM_ADDRESS:-no-reply@artificiorpg.com}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - DOWNLOADS_CLOUDINARY_COVERS_ENABLED=${DOWNLOADS_CLOUDINARY_COVERS_ENABLED:-false}
      - CLOUDINARY_COVER_UPLOAD_PRESET=${CLOUDINARY_COVER_UPLOAD_PRESET:-}
      - CATALOG_API_URL=${CATALOG_API_URL:-http://site-prod-app:4322}
      - CATALOG_INTERNAL_TOKEN=${CATALOG_INTERNAL_TOKEN:?CATALOG_INTERNAL_TOKEN is required}
    depends_on:
      downloads-db:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs
      - frontend_dist_downloads_prod:/app/frontend-dist:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/v1/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 256m

  downloads-db:
    image: postgres:16-alpine
    container_name: downloads-db
    restart: always
    networks:
      - artificio_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: downloads
    volumes:
      - pgdata_downloads_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d downloads"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_downloads_prod:
  frontend_dist_downloads_prod:

networks:
  artificio_net:
    external: true
