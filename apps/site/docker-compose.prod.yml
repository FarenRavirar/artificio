# Deploy prod do site (spec 030): raiz artificiorpg.com. 2 containers: app (Express serve Astro dist + admin) + db (store).
# Domínio artificiorpg.com + www → site-prod-app via Cloudflare Tunnel (rota = ação do mantenedor).
# Secrets via env (GitHub Environment): POSTGRES_PASSWORD, DATABASE_URL, JWT_SECRET(=prod, SSO D042),
# opc. CLOUDINARY_URL, PUBLIC_GA_ID.
services:
  site-prod-app:
    build:
      context: ../..
      dockerfile: apps/site/Dockerfile
      # Config pública lida em BUILD-TIME (achado de review, PR #271). Ver a explicação completa no
      # `docker-compose.beta.yml`: o `environment` abaixo é runtime e não alcança o `docker build`,
      # então canonical, sitemap e GA4 do `dist` da imagem sairiam errados sem estes args. Em prod
      # os valores coincidem com o fallback do `astro.config.mjs`, mas declarar aqui é o que impede
      # que uma futura mudança de domínio passe despercebida neste artefato.
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://artificiorpg.com}
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-G-2H50PCM950}
    container_name: site-prod-app
    restart: always
    expose:
      - "4322"
    networks:
      - artificio_net
    environment:
      - NODE_ENV=production
      - PORT=4322
      - DATABASE_URL=${DATABASE_URL}
      # WP_BASE e SITE_IMPORT_ON_START removidos em 2026-07-27 junto com o importador do WordPress
      # (WP fora do ar; store Postgres e a fonte de verdade desde D074/spec 029).
      # Cloudinary: aceita a forma URL unica OU as 3 vars (mesmas que o mesas ja usa na VM).
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Catalogo canonico de sistemas (spec 062): token de servico-a-servico
      # validando chamadas internas de mesas/glossario. Mesmo valor nos 3 .env prod.
      # Achado Codex (PR #145): faltava esta wiring no compose PROD (so tinha em beta).
      - CATALOG_INTERNAL_TOKEN=${CATALOG_INTERNAL_TOKEN:?CATALOG_INTERNAL_TOKEN is required}
      # Purga do cache da borda ao fim do rebuild. Sem estas duas, o rebuild termina e a
      # Cloudflare segue servindo o HTML antigo por até 2h (regra "Cache Everything — HTML",
      # edge_ttl 7200 em override_origin) — o artigo publicado fica invisível na listagem.
      # Ausentes: a purga vira no-op silencioso e o job reporta `attempted: false`.
      - CLOUDFLARE_PURGE_TOKEN=${CLOUDFLARE_PURGE_TOKEN:-}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}
      - PUBLIC_GA_ID=${PUBLIC_GA_ID:-G-2H50PCM950}
      - PUBLIC_SITE_URL=https://artificiorpg.com
      # T6.4 (spec 090) — fachada da conversa. A credencial de servico vive SO
      # aqui: o navegador nunca alcanca `/internal/v1` (requisito 6a), e sao
      # `realm`/`source_app` dela que o `accounts.` usa, nunca o payload (§1.1).
      # Sem as duas, a fachada responde `503` e a conversa degrada — que e o
      # comportamento correto, mas nao o desejado em producao.
      - ACCOUNTS_URL=${ACCOUNTS_URL:-https://accounts.artificiorpg.com}
      - SERVICE_CREDENTIAL=${SERVICE_CREDENTIAL:?SERVICE_CREDENTIAL is required}
      - JWT_SECRET=${JWT_SECRET}
      # Heap do Node EXPLÍCITO (2026-08-17, sessão 26-08-17_1). Sem esta linha o V8 deriva o old
      # space do cgroup: com o antigo limite de 512m, o Node enxergava 259 MB (medido em PROD com
      # `v8.getHeapStatistics().heap_size_limit`) e o `astro build` precisa de ~300 MB.
      # Prod só não caiu junto com beta porque servia um `dist` antigo pelo guard do entrypoint —
      # o próximo deploy com rebuild teria batido no mesmo OOM.
      - NODE_OPTIONS=--max-old-space-size=768
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.18.0.0/16}
    depends_on:
      site-prod-db:
        condition: service_healthy
    # SITE_FORCE_REBUILD: o entrypoint faz rebuild Astro se nao encontrar dist/index.html.
    # Com dist cacheado (ex.: reinicio apos seed), defina SITE_FORCE_REBUILD=true para regenerar.
    # Sem dist (1o boot), rebuild roda naturalmente.
    # As MIGRATIONS nao dependem desta flag desde 2026-07-27 (E018): rodam sempre, antes do guard.
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4322/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          # 1g, não os 512m padrão do repo (2026-08-17, sessão 26-08-17_1). Mesmo raciocínio do
          # beta: o heap declarado acima (768 MB) precisa caber DENTRO deste limite com folga para
          # o resto do processo, senão o OOM do V8 vira OOM-kill do kernel, que não deixa rastro
          # no log da aplicação. A VM tem 21 GB livres (medido) — 1g não pressiona nada.
          memory: 1g

  site-prod-db:
    image: postgres:16-alpine
    container_name: site-prod-db
    restart: always
    networks:
      - artificio_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: site
    volumes:
      - pgdata_site_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d site"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_site_prod:

networks:
  artificio_net:
    external: true
