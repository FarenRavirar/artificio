# Deploy beta do site (D044/D049). 2 containers: app (Express serve Astro dist + admin) + db (store).
# Domínio beta.artificiorpg.com -> site-beta-app via Cloudflare Tunnel (rota = ação do mantenedor).
# Secrets via env (GitHub Environment): POSTGRES_PASSWORD, DATABASE_URL, JWT_SECRET(=prod, SSO D042),
# opc. CLOUDINARY_URL, PUBLIC_GA_ID.
services:
  site-beta-app:
    build:
      context: ../..
      dockerfile: apps/site/Dockerfile
      # Config pública lida em BUILD-TIME (achado de review, PR #271). `astro.config.mjs` usa
      # `PUBLIC_SITE_URL` para canonical/sitemap e `Analytics.astro` inlina `PUBLIC_GA_ID` no HTML —
      # o `environment` abaixo é runtime e NÃO alcança o `docker build`. Sem estes args, o `dist` da
      # imagem de beta sairia com o canonical e o sitemap de PRODUÇÃO (medido) e sem GA4, e o
      # estrago apareceria justamente quando o fallback servisse esse seed.
      args:
        PUBLIC_SITE_URL: ${PUBLIC_SITE_URL:-https://beta.artificiorpg.com}
        PUBLIC_GA_ID: ${PUBLIC_GA_ID:-G-2H50PCM950}
        # Beta não distribui SEO: com isto o `robots.txt` gerado sai `Disallow: /` e SEM `Sitemap:`.
        # Precisa estar no BUILD (e não só no `environment` abaixo) porque o endpoint é SSG.
        SITE_NOINDEX: "true"
    container_name: site-beta-app
    restart: always
    expose:
      - "4322"
    networks:
      - artificio_net
    environment:
      - NODE_ENV=production
      - PORT=4322
      - DATABASE_URL=${DATABASE_URL}
      # WP_BASE e SITE_IMPORT_ON_START removidos em 2026-07-27 junto com o importador do WordPress
      # (WP fora do ar; store Postgres e a fonte de verdade desde D074/spec 029).
      # Cloudinary: aceita a forma URL única OU as 3 vars (mesmas que o mesas já usa na VM).
      - CLOUDINARY_URL=${CLOUDINARY_URL:-}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME:-}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY:-}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET:-}
      # Catalogo canonico de sistemas (spec 062): token de servico-a-servico
      # validando chamadas internas de mesas/glossario. Mesmo valor nos 3 .env.beta.
      - CATALOG_INTERNAL_TOKEN=${CATALOG_INTERNAL_TOKEN}
      - PUBLIC_GA_ID=${PUBLIC_GA_ID:-G-2H50PCM950}
      - PUBLIC_SITE_URL=https://beta.artificiorpg.com
      # T6.4 (spec 090) — fachada da conversa. Credencial de beta ja provisionada
      # no `accounts.` (`community_service_credential`, escopos comment.read e
      # comment.write). Sem as duas vars a fachada responde `503`.
      # `:?` e não `:-`: o default silencioso apontaria beta para o `accounts.`
      # de PRODUÇÃO se a variável faltasse (achado de review, PR #264). A
      # credencial de beta seria recusada lá, então não há escrita cruzada — mas
      # o sintoma vira `401` inexplicável em vez de falha de partida com o nome
      # da variável que falta. Em prod o default é o próprio host de prod, que é
      # inofensivo; aqui não é.
      - ACCOUNTS_URL=${ACCOUNTS_URL:?ACCOUNTS_URL is required}
      - SERVICE_CREDENTIAL=${SERVICE_CREDENTIAL:?SERVICE_CREDENTIAL is required}
      # Heap do Node EXPLÍCITO (2026-08-17, sessão 26-08-17_1). Sem esta linha o V8 deriva o old
      # space do cgroup: com o antigo limite de 512m, o Node enxergava 259 MB (medido com
      # `v8.getHeapStatistics().heap_size_limit`) e o `astro build` precisa de ~300 MB — OOM.
      # Declarado aqui, mexer no `mem_limit` não muda mais o heap por acidente.
      - NODE_OPTIONS=--max-old-space-size=768
      - SITE_NOINDEX=true
      - JWT_SECRET=${JWT_SECRET}
      - TRUSTED_PROXY_CIDR=${TRUSTED_PROXY_CIDR:-172.18.0.0/16}
    depends_on:
      site-beta-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:4322/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 180s
    deploy:
      resources:
        limits:
          # 1g, não os 512m padrão do repo (2026-08-17, sessão 26-08-17_1). O `site` é o único app
          # que pode rodar `astro build` em runtime (`SITE_FORCE_REBUILD`); os outros servem
          # artefato pronto. O heap declarado acima (768 MB) precisa caber DENTRO deste limite com
          # folga para o resto do processo — heap maior que o cgroup só troca o OOM do V8 pelo
          # OOM-kill do kernel, que é pior por não deixar rastro no log da aplicação.
          memory: 1g

  site-beta-db:
    image: postgres:16-alpine
    container_name: site-beta-db
    restart: always
    networks:
      - artificio_net
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: site
    volumes:
      - pgdata_site_beta:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d site"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata_site_beta:

networks:
  artificio_net:
    external: true
