packages:
  - "apps/*"
  - "apps/*/frontend"
  - "apps/*/backend"
  - "packages/*"
  # `scripts/` é pacote para que os scripts de tooling (deploy, CI, API, checagens
  # do repo) tenham onde ser testados e entrem no `turbo run test` como qualquer
  # outro. Antes disso nada ali tinha cobertura, e um bug de lógica num script de
  # decisão passava verde no CI (PR #243: falso DESTRAVADO no check do TS 7).
  - "scripts"
overrides:
  "form-data@<4.0.6": ">=4.0.6"
  "undici@<7.28.0": ">=7.28.0 <8"
  "@opentelemetry/core@<2.8.0": ">=2.8.0"
  "nanoid@>=4.0.0 <5.0.9": ">=5.0.9"
  "uuid@<11.1.1": ">=11.1.1"
  "esbuild@<0.28.1": ">=0.28.1"
  # Snyk SNYK-JS-POSTCSS-18313038 (CWE-22, CVSS 8.7): directory traversal.
  # Chega como transitiva do Tailwind e do sanitize-html (spec 089 T6B.2).
  "postcss@<8.5.18": ">=8.5.18"
  # Snyk SNYK-JS-LINKIFYIT-17901217 / CVE-2026-59887 (CWE-407, CVSS 8.7): ReDoS
  # no validador `mailto:`. Transitiva de markdown-it, usado no editor do mesas.
  #
  # O teto `<6` NÃO deixa o CVE aberto — a correção é o 5.0.2, que é o que fica
  # instalado. Ele impede um major que nenhum consumidor suporta: `markdown-it`
  # em sua versão MAIS RECENTE (14.3.0, verificado em 2026-07-28) ainda declara
  # `linkify-it: ^5.0.2`, e não existe release dele compatível com o 6.x.
  # A quebra é de forma da export — v5 devolve o construtor no `require`, v6
  # devolve objeto com named export — e forçar o 6 derruba o MarkdownEditor com
  # `TypeError: LinkifyIt is not a constructor`, junto com as 6 telas do mesas
  # que dependem dele (medido ao subir sem o teto).
  # Quando markdown-it passar a aceitar `^6`, este teto sai.
  "linkify-it@<5.0.2": ">=5.0.2 <6"
  # Snyk SNYK-JS-NANOID-18506897 / CVE-2026-67213 (CWE-835, CVSS 8.2): loop
  # infinito em `customRandom` quando `size` é 0 — a thread trava.
  #
  # A faixa 3.x precisa de entrada própria: o override `nanoid@>=4.0.0 <5.0.9`
  # acima não a alcança, e é o 3.3.16 que está instalado (via
  # `sanitize-html -> postcss -> nanoid`, medido no lock).
  #
  # O Snyk marca "no supported fix" porque o postcss ainda não publicou release
  # com a bump; o 3.3.17 existe no npm e é semver-compatível, então o override
  # resolve sem esperar por ele. Nosso código não chama `customRandom` em lugar
  # nenhum (busca negativa em `apps/` e `packages/`) — o postcss o usa com
  # tamanho fixo —, então o risco aqui é de cadeia, não de caminho alcançável.
  "nanoid@<3.3.17": ">=3.3.17 <4"
  # Snyk SNYK-JS-BODYPARSER-17906397 / CVE-2026-12590 (CWE-770, CVSS 6.3):
  # `normalizeOptions` ignora o `limit` quando ele não parseia, e o parser passa
  # a aceitar corpo de tamanho arbitrário.
  #
  # Transitiva de `express@5.2.1` e `express-rate-limit@8.5.2`. O 2.3.0 é a
  # correção e satisfaz o `^2.2.0` que o express 5 declara.
  "body-parser@<2.3.0": ">=2.3.0 <3"
  # Snyk CWE-918 (SSRF, CVSS 6.9), 3 ocorrências: `fromURL` aceitava host que
  # não é IPv6 em vez de falhar como o contrato promete.
  #
  # Sem versão corrigida nomeada pelo Snyk — o override aponta para o 10.5.0,
  # cujo release ("Honor the fromURL graceful-failure contract for non-IPv6
  # hosts", PR #218 do upstream) é o que trata esse contrato. Por isso o alerta
  # pode continuar aberto no painel até o Snyk classificar a versão; o que a
  # bump garante é não ficar numa release anterior à correção.
  #
  # O vetor NÃO é alcançável pelo nosso uso, medido: `ip-address` chega só via
  # `express-rate-limit@8.5.2`, que importa exclusivamente `Address6`
  # (`ipKeyGenerator`, para agrupar por sub-rede) e nunca chama `fromURL`; o
  # valor que entra ali é o IP do socket, não payload de usuário. Busca negativa
  # por `fromURL`/`ip-address` em `apps/`, `packages/` e `scripts/`: nenhum uso
  # direto. Isto é defesa em profundidade, não correção de caminho explorável.
  #
  # `^10.2.0` é o que o express-rate-limit declara, então o 10.5.0 entra sem
  # quebrar semver.
  "ip-address@<10.5.0": ">=10.5.0 <11"
  # NÃO é CVE: é duplicata de instância que quebra o editor do site-admin.
  #
  # `@blocknote/core@0.51.4` depende de `prosemirror-model@1.25.7` direto, e da
  # `1.25.11` por dentro do `@tiptap/pm@3.26.0` — que é dependência dele mesmo.
  # As duas cópias entram no bundle, e o ProseMirror recusa nó criado pela outra
  # instância: `RangeError: Can not convert <...> to a Fragment (looks like
  # multiple versions of prosemirror-model were loaded)`, seguido de
  # `TypeError: ... reading 'localsInner'` na montagem da view.
  #
  # Efeito medido em produção (2026-08-28): tela branca ao abrir QUALQUER post e
  # também em `/admin/posts/new` — criar e editar conteúdo indisponíveis.
  #
  # O piso `1.25.11` é a mais alta das duas já presentes, e satisfaz todas as
  # faixas declaradas na árvore (`^1.0.0`, `^1.7.1`, `^1.19.3` — nenhum
  # consumidor declara teto). O `<2` evita um major que mudaria a API do modelo.
  "prosemirror-model@<1.25.11": ">=1.25.11 <2"
  # `prosemirror-view` tinha a MESMA duplicata (`1.41.8` via `@blocknote/core`,
  # `1.42.2` via `@tiptap/pm`), e precisa da própria entrada: unificar só o
  # `model` deixou o editor ainda quebrado, agora em
  # `DecorationGroup.locals -> undefined.localsInner` — código do `view`, medido
  # no dev server depois do primeiro override. Decoration criada por uma cópia
  # não é reconhecida pela outra.
  #
  # Faixas declaradas na árvore: `^1.0.0`, `^1.9.10`, `^1.32.4`, sem teto.
  "prosemirror-view@<1.42.2": ">=1.42.2 <2"
patchedDependencies:
  "@types/express-serve-static-core@5.1.1": patches/@types__express-serve-static-core@5.1.1.patch
allowBuilds:
  sharp: true
  bcrypt: true
  esbuild: true
