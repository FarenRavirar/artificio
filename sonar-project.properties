# ⚠️ ESTE ARQUIVO NÃO TEM EFEITO HOJE. A configuração ativa é `.sonarcloud.properties`.
#
# A análise deste repo é a **Automatic Analysis** do SonarQube Cloud (via
# integração do GitHub App — não há workflow chamando o scanner). Nesse modo a
# doc é explícita: "If you import a project that already contains a
# `sonar-project.properties` file, SonarQube Cloud will ignore the parameters in
# your sonar-project.properties file."
#
# Ou seja: tudo aqui é lido **apenas** se a análise automática for desligada em
# favor de análise por CI/CD. Enquanto isso não acontecer, edite
# `.sonarcloud.properties` — e mantenha os dois em sincronia, para que uma
# migração futura para CI/CD não perca as exclusões.
#
# Descoberto em 2026-08-17, depois de exclusões adicionadas aqui continuarem sem
# efeito: elas viviam no arquivo errado desde a PR #113, então
# `docs/api/generated/**` nunca esteve de fato excluído.
#
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

sonar.exclusions=docs/api/generated/**,**/*.html
sonar.cpd.exclusions=docs/api/generated/**
