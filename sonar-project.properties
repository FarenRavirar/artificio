# Configuração do SonarCloud — Artifício RPG
#
# Lido pela Automatic Analysis do SonarCloud, que procura este arquivo na raiz
# do repositório. Não há workflow de CI chamando o scanner: a análise vem pela
# integração do GitHub App.

# `projectKey`/`organization` NÃO entram aqui de propósito: a Automatic Analysis
# já resolve os dois pela integração do GitHub App (confirmado na API —
# `organization: farenravirar`, `key: FarenRavirar_artificio`), e declará-los no
# arquivo só cria uma segunda fonte de verdade que pode divergir do painel.

# --- Exclusões de análise ---------------------------------------------------
#
# HTML inteiro fora da análise (decisão do mantenedor, 2026-08-17): os achados
# em `.html` deste repo foram sempre falso-positivo, e a composição explica por
# quê — dos 26 arquivos versionados, nenhum é código de aplicação:
#
# - `apps/*/frontend/index.html` e `apps/site-admin/index.html`: ponto de
#   entrada do Vite, praticamente só a tag `<script type="module">`. A lógica
#   vive no TS/TSX, que continua analisado.
# - `apps/downloads/backend/test/fixtures/**/*.html`: páginas reais capturadas
#   de lojas externas (DriveThruRPG, itch.io, Storytellers Vault, Ópera,
#   Grimórios), usadas como entrada dos testes do scraper. É **HTML de
#   terceiros**, preservado byte a byte de propósito — "corrigir" um achado ali
#   invalidaria a fixture, que existe justamente para reproduzir o markup real.
# - `docs/api/generated/*-api-docs.html`: gerado por `pnpm api:bundle`, nunca
#   editado à mão (mesma razão que já exclui `docs/api/generated/**` do review
#   de bot, ver AGENTS.md §Review guidelines).
#
# O que **permanece** analisado é o que importa: `apps/**`, `packages/**` e
# `scripts/**` em TS/TSX/JS.
# `docs/api/generated/**` já estava aqui antes e permanece: é saída de
# `pnpm verify:api` / `pnpm api:bundle`, nunca editada à mão (AGENTS.md §Review
# guidelines aplica a mesma exclusão aos outros bots).
sonar.exclusions=docs/api/generated/**,**/*.html

# Duplicação: artefato gerado repete estrutura por natureza, e contá-lo como
# código duplicado polui a métrica do que é escrito à mão.
sonar.cpd.exclusions=docs/api/generated/**
