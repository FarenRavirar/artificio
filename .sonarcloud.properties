# Configuração do SonarQube Cloud (Automatic Analysis) — Artifício RPG
#
# **O nome do arquivo importa.** A Automatic Analysis lê `.sonarcloud.properties`
# e **ignora** `sonar-project.properties` — a doc é explícita: "If you import a
# project that already contains a `sonar-project.properties` file, SonarQube
# Cloud will ignore the parameters in your sonar-project.properties file".
# Aquele arquivo só passa a valer se a análise automática for desligada em favor
# de análise por CI/CD, que não é o caso aqui (não há workflow chamando o
# scanner; a análise vem pela integração do GitHub App).
#
# Consequência medida em 2026-08-17: as exclusões viviam no arquivo errado desde
# a PR #113, então `docs/api/generated/**` nunca esteve de fato excluído.
#
# https://docs.sonarsource.com/sonarqube-cloud/analyzing-source-code/automatic-analysis

# --- Exclusões de análise ---------------------------------------------------
#
# `docs/api/generated/**`: saída de `pnpm verify:api` / `pnpm api:bundle`, nunca
# editada à mão (AGENTS.md §Review guidelines aplica a mesma exclusão aos outros
# bots).
#
# `**/*.html`: os achados em HTML deste repo foram sempre falso-positivo, e a
# composição explica por quê — dos 26 arquivos versionados, nenhum é código de
# aplicação:
#
# - `apps/*/frontend/index.html` e `apps/site-admin/index.html`: ponto de
#   entrada do Vite, praticamente só a tag `<script type="module">`. A lógica
#   vive no TS/TSX, que continua analisado.
# - `apps/downloads/backend/test/fixtures/**/*.html`: páginas reais capturadas
#   de lojas externas (DriveThruRPG, itch.io, Storytellers Vault, Ópera,
#   Grimórios), usadas como entrada dos testes do scraper. É HTML de terceiros,
#   preservado byte a byte de propósito — "corrigir" um achado ali invalidaria a
#   fixture, que existe justamente para reproduzir o markup real.
# - `docs/api/generated/*-api-docs.html`: gerado, nunca editado à mão.
#
# O que permanece analisado é o que importa: `apps/**`, `packages/**` e
# `scripts/**` em TS/TSX/JS.
sonar.exclusions=docs/api/generated/**,**/*.html

# Duplicação: artefato gerado repete estrutura por natureza, e contá-lo como
# código duplicado polui a métrica do que é escrito à mão.
sonar.cpd.exclusions=docs/api/generated/**
